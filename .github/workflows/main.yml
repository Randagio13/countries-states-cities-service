name: CI
on:
  push:
    branches: [main, beta, alpha]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint and format check
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Run tests with coverage
        run: pnpm coverage
      - name: Build package
        run: pnpm build
      - name: Check published type resolution
        run: pnpm exec attw --pack . --profile node16

  publish:
    name: Publish
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build package
        run: pnpm build
      - name: Publish
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          # Distinguish "already published" from "the registry lookup failed".
          # Treating a lookup error as "not published" would retry a publish
          # that then fails on a duplicate version; treating it as "published"
          # would silently skip a real release.
          if PUBLISHED=$(npm view "countries-states-cities-service@$VERSION" version 2>/dev/null); then
            echo "Version $PUBLISHED already published, skipping"
          elif npm view countries-states-cities-service version >/dev/null 2>&1; then
            echo "Publishing $VERSION with provenance"
            npm publish --access public --provenance
          else
            echo "::error::Cannot reach the npm registry; refusing to guess publish state"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
